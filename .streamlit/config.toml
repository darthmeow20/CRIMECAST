[server]
headless = true
enableCORS = false
enableXsrfProtection = true
# Render / cloud sets PORT; local default still works in Streamlit CLI
maxUploadSize = 50

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#ef4444"
backgroundColor = "#0a0a0c"
secondaryBackgroundColor = "#0c0c0f"
textColor = "#e8e8ed"
